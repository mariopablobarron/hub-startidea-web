name: Verificar deploy (hubstartidea.es)

# IMPORTANTE: este workflow YA NO despliega.
# El deploy real lo hace un cron-pull en el VPS cada 5 min
# (/root/hub-startidea-web-autodeploy.sh): compara el sha de main con el tag de
# la imagen en marcha y, si hay cambios desplegables, corre el deploy. Se migró
# a pull el 2026-06-11 porque fail2ban banea el SSH entrante del runner en :22.
#
# Aquí solo VERIFICAMOS: hacemos polling de /api/health (que expone COMMIT_SHA)
# hasta que el commit pusheado esté realmente sirviéndose en producción.
# Verde = el commit está vivo en prod. Rojo = no llegó a desplegarse a tiempo.
#
# paths-ignore replica el filtro del cron-pull: cambios solo en docs/infra/CI no
# disparan deploy, así que tampoco deben disparar (ni hacer fallar) esta verificación.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - 'infra/**'
      - '.github/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch: {}

concurrency:
  group: verify-deploy-hub-startidea-web
  cancel-in-progress: false

jobs:
  verify:
    name: Esperar a que el cron-pull publique este commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Polling de /api/health
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Esperando commit=$SHORT en https://hubstartidea.es/api/health"
          echo "(el deploy lo hace el cron-pull del VPS; puede tardar ~5-12 min)"
          for i in $(seq 1 64); do
            COMMIT=$(curl -fsS -m 10 https://hubstartidea.es/api/health 2>/dev/null \
              | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || echo "")
            echo "[$i/64] health commit=${COMMIT:-(sin respuesta)}"
            if [ "$COMMIT" = "$SHORT" ]; then
              echo "::notice::Commit $SHORT desplegado y sirviéndose en producción"
              exit 0
            fi
            sleep 15
          done
          echo "::error::El commit $SHORT no apareció en /api/health tras ~16 min."
          echo "El deploy lo hace el cron-pull del VPS: revisa /var/log/hub-startidea-web-autodeploy.log"
          exit 1
